<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#003262">
    AR Drone Navigation Pipeline
  </text>
  <text x="450" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    Grid Search and ArUco-based Localization
  </text>

  <!-- Camera Switching -->
  <rect x="325" y="80" width="250" height="80" rx="5" fill="#FFE6E6" stroke="#003262" stroke-width="2"/>
  <text x="450" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Dual Camera System</text>
  <text x="450" y="125" font-family="Arial" font-size="11" text-anchor="middle">Intermittent Switching (2s intervals)</text>
  <text x="450" y="143" font-family="Arial" font-size="10" text-anchor="middle">Bottom: ArUco Detection</text>
  <text x="450" y="155" font-family="Arial" font-size="10" text-anchor="middle">Front: Obstacle Monitoring</text>

  <!-- ArUco Detection -->
  <rect x="100" y="190" width="250" height="90" rx="5" fill="#FFCCCC" stroke="#003262" stroke-width="2"/>
  <text x="225" y="215" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">ArUco Marker Detection</text>
  <text x="225" y="235" font-family="Arial" font-size="10" text-anchor="middle">OpenCV ArUco (DICT_4X4_50)</text>
  <text x="225" y="250" font-family="Arial" font-size="10" text-anchor="middle">Marker 0 → Origin (0, 0)</text>
  <text x="225" y="265" font-family="Arial" font-size="10" text-anchor="middle">Marker 1 → Target (x, y)</text>

  <!-- Grid Search -->
  <rect x="550" y="190" width="250" height="90" rx="5" fill="#FFCCCC" stroke="#003262" stroke-width="2"/>
  <text x="675" y="215" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Grid Search Algorithm</text>
  <text x="675" y="235" font-family="Arial" font-size="10" text-anchor="middle">Snake/Boustrophedon Pattern</text>
  <text x="675" y="250" font-family="Arial" font-size="10" text-anchor="middle">5×5 grid, 0.5m cells</text>
  <text x="675" y="265" font-family="Arial" font-size="10" text-anchor="middle">Waypoint-based traversal</text>

  <!-- Pose Estimation -->
  <rect x="100" y="310" width="250" height="80" rx="5" fill="#FFB3B3" stroke="#003262" stroke-width="2"/>
  <text x="225" y="335" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Pose Estimation (PnP)</text>
  <text x="225" y="353" font-family="Arial" font-size="10" text-anchor="middle">4 corner points → 6-DOF pose</text>
  <text x="225" y="368" font-family="Arial" font-size="9" text-anchor="middle">Rotation Matrix R + Translation t</text>
  <text x="225" y="382" font-family="Arial" font-size="9" text-anchor="middle">Accuracy: ±2cm @ 1m</text>

  <!-- State Tracking -->
  <rect x="550" y="310" width="250" height="80" rx="5" fill="#FFB3B3" stroke="#003262" stroke-width="2"/>
  <text x="675" y="335" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">State Tracking</text>
  <text x="675" y="353" font-family="Arial" font-size="10" text-anchor="middle">0: Unexplored</text>
  <text x="675" y="368" font-family="Arial" font-size="10" text-anchor="middle">1: Exploring</text>
  <text x="675" y="382" font-family="Arial" font-size="10" text-anchor="middle">2: Explored | 3: Target Found</text>

  <!-- Transform Computation -->
  <rect x="200" y="420" width="500" height="80" rx="5" fill="#FF9999" stroke="#003262" stroke-width="2"/>
  <text x="450" y="445" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Transform Computation</text>
  <text x="450" y="465" font-family="Arial" font-size="11" text-anchor="middle">Body Frame → World Frame</text>
  <text x="450" y="482" font-family="Arial" font-size="10" text-anchor="middle">Integrate velocities × time with yaw rotation</text>
  <text x="450" y="495" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">x' = x + v·cos(ψ)·Δt,  y' = y + v·sin(ψ)·Δt</text>

  <!-- Control Layer -->
  <rect x="100" y="530" width="250" height="80" rx="5" fill="#FF8080" stroke="#003262" stroke-width="2"/>
  <text x="225" y="555" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Optical Centering</text>
  <text x="225" y="573" font-family="Arial" font-size="10" text-anchor="middle">Proportional Control</text>
  <text x="225" y="588" font-family="Arial" font-size="9" text-anchor="middle">Align marker center ↔ image center</text>
  <text x="225" y="602" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">u = K_p × (center_tag − center_img)</text>

  <rect x="550" y="530" width="250" height="80" rx="5" fill="#FF8080" stroke="#003262" stroke-width="2"/>
  <text x="675" y="555" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">IMU Centering</text>
  <text x="675" y="573" font-family="Arial" font-size="10" text-anchor="middle">Velocity Integration</text>
  <text x="675" y="588" font-family="Arial" font-size="9" text-anchor="middle">Track position via IMU data</text>
  <text x="675" y="602" font-family="Arial" font-size="9" text-anchor="middle">Compensate for drift and wind</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#003262"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FDB515"/>
    </marker>
  </defs>

  <!-- Main flow -->
  <line x1="400" y1="160" x2="225" y2="190" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="160" x2="675" y2="190" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="225" y1="280" x2="225" y2="310" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="675" y1="280" x2="675" y2="310" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="350" y1="350" x2="400" y2="420" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="350" x2="500" y2="420" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="350" y1="500" x2="225" y2="530" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="500" x2="675" y2="530" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Communication output -->
  <rect x="325" y="620" width="250" height="20" rx="3" fill="#FDB515"/>
  <text x="450" y="634" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#003262">
    Transmit to Tello Drone
  </text>
  <line x1="350" y1="610" x2="400" y2="620" stroke="#FDB515" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <line x1="550" y1="610" x2="500" y2="620" stroke="#FDB515" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <!-- Labels -->
  <text x="30" y="235" font-family="Arial" font-size="10" font-weight="bold" fill="#003262">Perception</text>
  <text x="30" y="350" font-family="Arial" font-size="10" font-weight="bold" fill="#003262">Processing</text>
  <text x="30" y="465" font-family="Arial" font-size="10" font-weight="bold" fill="#003262">Planning</text>
  <text x="30" y="570" font-family="Arial" font-size="10" font-weight="bold" fill="#003262">Control</text>

  <!-- Footer -->
  <text x="450" y="640" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">
    AR Drone: Helper/Scout for High-Altitude Reconnaissance
  </text>
</svg>
