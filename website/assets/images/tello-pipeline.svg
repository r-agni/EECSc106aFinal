<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#003262"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#CC0000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#003262">
    Tello Drone Navigation Pipeline
  </text>
  <text x="450" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    Real-time Obstacle Detection and Reactive Avoidance
  </text>

  <!-- Camera Input -->
  <rect x="375" y="80" width="150" height="60" rx="5" fill="#E6F3FF" stroke="#003262" stroke-width="2"/>
  <text x="450" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Camera Input</text>
  <text x="450" y="125" font-family="Arial" font-size="11" text-anchor="middle">720p @ 30 FPS</text>

  <!-- YOLOv8 Detection -->
  <rect x="350" y="170" width="200" height="80" rx="5" fill="#CCE5FF" stroke="#003262" stroke-width="2"/>
  <text x="450" y="195" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">YOLOv8 Object Detection</text>
  <text x="450" y="213" font-family="Arial" font-size="10" text-anchor="middle">Model: YOLOv8-nano</text>
  <text x="450" y="228" font-family="Arial" font-size="10" text-anchor="middle">Performance: 10-15 FPS</text>
  <text x="450" y="243" font-family="Arial" font-size="10" text-anchor="middle">Output: bbox, class, confidence</text>

  <!-- Distance Estimation -->
  <rect x="100" y="280" width="180" height="70" rx="5" fill="#B3D9FF" stroke="#003262" stroke-width="2"/>
  <text x="190" y="305" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Distance Estimation</text>
  <text x="190" y="323" font-family="Arial" font-size="10" text-anchor="middle">Pinhole Camera Model</text>
  <text x="190" y="338" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">d = (H × f) / h</text>

  <!-- Threat Assessment -->
  <rect x="310" y="280" width="180" height="70" rx="5" fill="#B3D9FF" stroke="#003262" stroke-width="2"/>
  <text x="400" y="305" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Threat Assessment</text>
  <text x="400" y="323" font-family="Arial" font-size="10" text-anchor="middle">Position + Distance Based</text>
  <text x="400" y="338" font-family="Arial" font-size="9" text-anchor="middle">HIGH | MEDIUM | LOW</text>

  <!-- Maneuver Selection -->
  <rect x="520" y="280" width="180" height="70" rx="5" fill="#B3D9FF" stroke="#003262" stroke-width="2"/>
  <text x="610" y="305" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Maneuver Selection</text>
  <text x="610" y="323" font-family="Arial" font-size="10" text-anchor="middle">Lateral or Vertical Dodge</text>
  <text x="610" y="338" font-family="Arial" font-size="9" text-anchor="middle">Balanced (Net Δ = 0)</text>

  <!-- Path Planning Box -->
  <rect x="50" y="380" width="800" height="100" rx="5" fill="#99CCFF" stroke="#003262" stroke-width="2"/>
  <text x="450" y="405" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Path Planning &amp; Replanning</text>

  <!-- Linear Interpolation -->
  <rect x="80" y="420" width="200" height="50" rx="3" fill="#E6F3FF" stroke="#003262" stroke-width="1.5"/>
  <text x="180" y="438" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Linear Interpolation</text>
  <text x="180" y="453" font-family="Arial" font-size="9" text-anchor="middle">Generate direct waypoints</text>
  <text x="180" y="465" font-family="Arial" font-size="9" text-anchor="middle">Start → Goal (straight line)</text>

  <!-- Bresenham Algorithm -->
  <rect x="310" y="420" width="200" height="50" rx="3" fill="#E6F3FF" stroke="#003262" stroke-width="1.5"/>
  <text x="410" y="438" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Bresenham's Algorithm</text>
  <text x="410" y="453" font-family="Arial" font-size="9" text-anchor="middle">Discrete grid waypoints</text>
  <text x="410" y="465" font-family="Arial" font-size="9" text-anchor="middle">Integer-only arithmetic</text>

  <!-- Reactive Recompute -->
  <rect x="540" y="420" width="200" height="50" rx="3" fill="#FFE6E6" stroke="#003262" stroke-width="1.5"/>
  <text x="640" y="438" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Reactive Recompute</text>
  <text x="640" y="453" font-family="Arial" font-size="9" text-anchor="middle">If obstacle detected:</text>
  <text x="640" y="465" font-family="Arial" font-size="9" text-anchor="middle">Execute dodge → Replan path</text>

  <!-- Dead Reckoning -->
  <rect x="150" y="510" width="200" height="70" rx="5" fill="#99CCFF" stroke="#003262" stroke-width="2"/>
  <text x="250" y="535" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Dead Reckoning</text>
  <text x="250" y="553" font-family="Arial" font-size="10" text-anchor="middle">Position Estimation</text>
  <text x="250" y="568" font-family="Arial" font-size="9" text-anchor="middle">Integrate commands + IMU</text>

  <!-- PID Controller -->
  <rect x="400" y="510" width="200" height="70" rx="5" fill="#99CCFF" stroke="#003262" stroke-width="2"/>
  <text x="500" y="535" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">PID Controller</text>
  <text x="500" y="553" font-family="Arial" font-size="10" text-anchor="middle">Precision Landing</text>
  <text x="500" y="568" font-family="Arial" font-size="9" text-anchor="middle">±10cm accuracy</text>

  <!-- Execute Movement -->
  <rect x="325" y="610" width="250" height="60" rx="5" fill="#66B2FF" stroke="#003262" stroke-width="2"/>
  <text x="450" y="635" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Execute Movement Commands</text>
  <text x="450" y="655" font-family="Arial" font-size="10" text-anchor="middle">Forward | Back | Left | Right | Up | Down | Rotate</text>

  <!-- Main flow arrows -->
  <line x1="450" y1="140" x2="450" y2="170" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="250" x2="190" y2="280" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="250" x2="400" y2="280" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="250" x2="610" y2="280" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- To path planning -->
  <line x1="190" y1="350" x2="190" y2="380" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="350" x2="400" y2="380" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="350" x2="610" y2="380" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- To control -->
  <line x1="250" y1="480" x2="250" y2="510" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="480" x2="500" y2="510" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- To execute -->
  <line x1="300" y1="580" x2="400" y2="610" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="580" x2="500" y2="610" stroke="#003262" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feedback loop (red) -->
  <path d="M 575 640 Q 750 640 750 315 Q 750 120 525 120" fill="none" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
  <text x="780" y="380" font-family="Arial" font-size="10" fill="#CC0000" font-weight="bold">Feedback</text>
  <text x="780" y="395" font-family="Arial" font-size="9" fill="#CC0000">Loop</text>

  <!-- Labels -->
  <text x="30" y="315" font-family="Arial" font-size="10" font-weight="bold" fill="#003262">Perception</text>
  <text x="30" y="430" font-family="Arial" font-size="10" font-weight="bold" fill="#003262">Planning</text>
  <text x="30" y="545" font-family="Arial" font-size="10" font-weight="bold" fill="#003262">Control</text>
  <text x="30" y="640" font-family="Arial" font-size="10" font-weight="bold" fill="#003262">Execution</text>

  <!-- Footer -->
  <text x="450" y="690" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">
    Tello Drone: Parent/Payload Carrier with Real-time Obstacle Avoidance
  </text>
</svg>
